name: CI and Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck linter
        uses: ludeeus/action-shellcheck@master

      - name: Run unit test
        run: |
          chmod +x app_calculator.sh
          ./app_calculator.sh 5 10

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-app:${{ github.sha }} .

      - name: Test Docker Container
        run: |
          docker run -d -p 8080:8080 --name test_app my-app:${{ github.sha }}
          sleep 2
          curl --fail http://localhost:8080 || exit 1

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run Ansible Lint
        run: |
          ansible-lint ansible_iac/setup_env.yml
