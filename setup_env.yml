---
- name: Setup Environment
  hosts: all
  become: true
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
    - name: Copy custom index file
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/index.html
        mode: '0644'
    - name: Ensure service is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
